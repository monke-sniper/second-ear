<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Second Ear</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Every word comes from the COPY dictionary in app.js, by data-copy key. -->

    <!-- DangerBanner — docs/design/components/danger-banner.md. Above everything, never dismissible. -->
    <div class="danger-banner" id="danger-banner" role="alert" aria-live="assertive" hidden>
      <div class="danger-banner__inner">
        <span class="danger-banner__shape" aria-hidden="true">&#9632;</span>
        <div>
          <p class="danger-banner__title" data-copy="danger_title"></p>
          <p class="danger-banner__body" data-copy="danger_body"></p>
        </div>
      </div>
    </div>

    <main class="app" id="app" data-screen="ready">
      <!-- Demo console only (screen 6): first of all, that nothing here is live -->
      <p class="notice" id="demo-foot" data-copy="demo_footer" hidden></p>

      <header class="app__bar">
        <h1 class="app__title" data-copy="app_title"></h1>
        <p class="app__status" id="status" role="status"></p>
        <!-- Ready screen only (screen 1): the promise, under the line that says what to do -->
        <p class="app__promise" id="privacy-note" data-copy="privacy_note" hidden></p>
      </header>

      <!-- Demo console only (screen 6): what is being replayed -->
      <section class="demo-card" id="demo-card" hidden>
        <p class="demo-card__file" id="demo-file"></p>
        <p class="note" id="demo-label"></p>
        <button class="btn btn--primary" id="demo-play" type="button" data-copy="demo_play" disabled></button>
      </section>

      <!-- RiskMeter — docs/design/components/risk-meter.md -->
      <section
        class="meter"
        id="risk-meter"
        role="meter"
        data-band="calm"
        data-copy-label="meter_label"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="meter__row">
          <span class="meter__shape" id="risk-shape" aria-hidden="true"></span>
          <span class="meter__word" id="risk-word"></span>
          <span class="meter__score" id="risk-score"></span>
        </div>
        <div class="meter__track" aria-hidden="true"><div class="meter__fill" id="risk-fill"></div></div>
      </section>
      <p class="note" id="real-call-note" data-copy="real_call_note" hidden></p>

      <div class="timeline" id="timeline" aria-hidden="true" hidden>
        <div class="timeline__fill" id="timeline-fill"></div>
        <span class="timeline__mark" id="timeline-mark" hidden></span>
      </div>
      <p class="note" id="timeline-note" hidden></p>

      <section class="transcript" id="transcript" data-copy-label="transcript_label"></section>

      <div class="controls">
        <button class="btn btn--primary" id="start" type="button" data-copy="start"></button>
        <button class="btn btn--outline" id="stop" type="button" data-copy="stop" hidden></button>
        <button class="link" id="demo" type="button" data-copy="demo_mode"></button>
      </div>
      <p class="note" id="mic-note" data-copy="mic_note" hidden></p>
    </main>

    <!-- AlertSheet — docs/design/components/alert-sheet.md. Outside <main>, which goes inert behind it. -->
    <div class="scrim" id="alert-scrim" hidden>
      <section
        class="sheet"
        id="alert-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="alert-title"
        data-level="caution"
      >
        <header class="sheet__header">
          <span class="sheet__shape" id="alert-shape" aria-hidden="true"></span>
          <h2 class="sheet__title" id="alert-title" tabindex="-1"></h2>
        </header>

        <!-- SafeExitCard — docs/design/components/safe-exit-card.md -->
        <section class="card" aria-labelledby="say-this">
          <p class="card__label" id="say-this" data-copy="say_this"></p>
          <blockquote class="safe-exit__line" id="safe-exit-line"></blockquote>
        </section>

        <!-- OfficialNumberCard — docs/design/components/official-number-card.md -->
        <section class="card" aria-labelledby="call-back">
          <p class="card__label" id="call-back" data-copy="call_back"></p>
          <p class="official__org" id="official-org" hidden></p>
          <a class="official__number" id="official-number" hidden></a>
          <p class="official__fallback" id="official-fallback" data-copy="call_back_fallback"></p>
        </section>

        <footer class="sheet__footer">
          <button class="btn btn--neutral" id="real-call" type="button" data-copy="real_call"></button>
          <!-- Where the line to say was written: on this device, or by a cloud model -->
          <p class="note sheet__source" id="explainer-source" hidden></p>
        </footer>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
